services:
  postgres:
    image: postgres:16.6
    container_name: caresync-vavs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caresync_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caresync_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
